<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intel8080TS Debugger</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Intel8080TS Debugger</h1>
      <a href="https://github.com/rsdiaz/Intel8080TS" target="_blank" rel="noopener" class="github-link" title="View on GitHub">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
    </header>

    <nav id="toolbar">
      <button id="btn-load" title="Load a .COM file">📁 Load ROM</button>
      <input type="file" id="file-input" hidden accept=".com,.bin,.rom" />
      <button id="btn-step" title="Execute one instruction">Step →</button>
      <button id="btn-run" title="Run until HLT or breakpoint">▶ Run</button>
      <button id="btn-stop" title="Stop execution" disabled>⏹ Stop</button>
      <button id="btn-reset" title="Reset CPU">↺ Reset</button>
      <span class="sep"></span>
      <select id="rom-select">
        <option value="">— Quick load —</option>
      </select>
      <span id="status">Idle</span>
    </nav>

    <main>
      <aside id="registers-panel">
        <h2>Registers</h2>
        <div id="registers-grid"></div>

        <h2>Flags</h2>
        <div id="flags-row"></div>

        <h2>Breakpoints</h2>
        <div id="bp-section">
          <div id="bp-list">None</div>
          <div id="bp-form">
            <input type="text" id="bp-addr" placeholder="0x0100" value="" />
            <button id="btn-bp-set">Add</button>
            <button id="btn-bp-remove">Remove</button>
            <button id="btn-bp-clear">Clear all</button>
          </div>
        </div>
      </aside>

      <section id="right-panel">
        <div id="disasm-panel" class="panel">
          <div class="panel-header">
            <h2>Disassembly</h2>
            <span class="panel-hint">PC →</span>
          </div>
          <pre id="disasm-content"></pre>
        </div>

        <div id="memory-panel" class="panel">
          <div class="panel-header">
            <h2>Memory</h2>
            <div class="panel-controls">
              <input
                type="text"
                id="mem-addr"
                value="0x0100"
                class="addr-input"
              />
              <button id="btn-mem-refresh">Refresh</button>
              <button id="btn-mem-goto-pc">PC</button>
            </div>
          </div>
          <pre id="memory-content"></pre>
        </div>

        <div id="log-panel" class="panel">
          <div class="panel-header">
            <h2>Log</h2>
            <button id="btn-log-clear">Clear</button>
          </div>
          <pre id="log-content"></pre>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
